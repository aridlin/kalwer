plugins { id 'com.android.application' }

android {
    namespace 'pl.aridlin.kalwer'
    compileSdk 35
    ndkVersion '27.2.12479018'
    externalNativeBuild { cmake { path 'src/main/cpp/CMakeLists.txt'; version '3.22.1' } }
    sourceSets { main { jniLibs.srcDirs = ['build/generated/koom'] } }
    packaging { jniLibs { useLegacyPackaging = true } }
    useLibrary 'android.test.runner'
    useLibrary 'android.test.base'
    useLibrary 'android.test.mock'
    defaultConfig {
        applicationId 'pl.aridlin.kalwer'
        minSdk 26
        ndk { abiFilters 'arm64-v8a', 'armeabi-v7a', 'x86_64', 'x86' }
        externalNativeBuild { cmake { cppFlags '-std=c++20' } }
        targetSdk 35
        versionCode 8
        versionName '0.4.1'
        testInstrumentationRunner 'android.test.InstrumentationTestRunner'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    // Reuse the installed APK's key locally; let AGP create its default key on clean CI.
    def existingDebugKey = file(System.getProperty("user.home") + "/.android/debug.keystore")
    if (existingDebugKey.exists()) {
        signingConfigs { debug { storeFile existingDebugKey } }
    }
    buildTypes {
        release { minifyEnabled false }
    }
    lint { abortOnError true }
}

// The helper is an executable emitted by CMake into jniLibs. Build it before
// Gradle snapshots that directory, including on a clean CI checkout.
afterEvaluate {
    ['Debug', 'Release'].each { variant ->
        tasks.named("merge${variant}JniLibFolders").configure {
            dependsOn "externalNativeBuild${variant}"
        }
    }
}
