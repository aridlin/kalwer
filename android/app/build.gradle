plugins { id 'com.android.application' }

android {
    namespace 'pl.aridlin.kalwer'
    compileSdk 35
    useLibrary 'android.test.runner'
    useLibrary 'android.test.base'
    useLibrary 'android.test.mock'
    defaultConfig {
        applicationId 'pl.aridlin.kalwer'
        minSdk 26
        targetSdk 35
        versionCode 5
        versionName '0.3.0'
        testInstrumentationRunner 'android.test.InstrumentationTestRunner'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    // Reuse the installed APK's key locally; let AGP create its default key on clean CI.
    def existingDebugKey = file(System.getProperty("user.home") + "/.android/debug.keystore")
    if (existingDebugKey.exists()) {
        signingConfigs { debug { storeFile existingDebugKey } }
    }
    buildTypes {
        release { minifyEnabled false }
    }
    lint { abortOnError true }
}
