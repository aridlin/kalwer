name: Native games
on:
  push:
    paths: ['main.cpp', 'multiline_gtk.hpp', 'update_status.hpp', 'release_selection.hpp', 'game_trials.hpp', 'kar.hpp', 'kar_pixels.hpp', 'kar_art.hpp', 'game_assets.hpp', 'tools/pack_kar_art.py', 'kar_course.hpp', 'kar_physics.hpp', 'tetris.hpp', 'breakout.hpp', 'calculator_format.hpp', 'passive_koins.hpp', 'koom.hpp', 'koom/**', 'latest_worker.hpp', 'chess.hpp', 'garden.hpp', 'shop.hpp', 'peggle.hpp', 'appearance.hpp', 'live_backdrop.hpp', 'gpu*.hpp', 'games*.hpp', 'windows/kalwer_windows.cpp', 'tests/*test.cpp', '.github/workflows/games.yml']
  pull_request:
    paths: ['main.cpp', 'multiline_gtk.hpp', 'update_status.hpp', 'release_selection.hpp', 'game_trials.hpp', 'kar.hpp', 'kar_pixels.hpp', 'kar_art.hpp', 'game_assets.hpp', 'tools/pack_kar_art.py', 'kar_course.hpp', 'kar_physics.hpp', 'tetris.hpp', 'breakout.hpp', 'calculator_format.hpp', 'passive_koins.hpp', 'koom.hpp', 'koom/**', 'latest_worker.hpp', 'chess.hpp', 'garden.hpp', 'shop.hpp', 'peggle.hpp', 'appearance.hpp', 'live_backdrop.hpp', 'gpu*.hpp', 'games*.hpp', 'windows/kalwer_windows.cpp', 'tests/*test.cpp', '.github/workflows/games.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          for test in games peggle appearance chess garden shop latest_worker expansion release_selection kar_physics kar_pixels kar game_trials game_assets koom_loading; do
            g++ -std=c++20 -O1 -Wall -Wextra -Wpedantic -fsanitize=address,undefined -g tests/${test}_test.cpp -o /tmp/${test}-test
            /tmp/${test}-test
          done
      - run: |
          sudo apt-get update -qq
          sudo apt-get install -y libgtk-3-dev xvfb
          g++ -std=c++20 -Wall -Wextra -Wpedantic tests/multiline_gtk_test.cpp $(pkg-config --cflags --libs gtk+-3.0) -o /tmp/multiline-gtk-test
          xvfb-run /tmp/multiline-gtk-test
      - run: |
          python3 koom/build.py
          g++ -std=c++20 -O1 -pthread tests/koom_runtime_test.cpp -o /tmp/koom-runtime-test
          /tmp/koom-runtime-test
          g++ -std=c++20 -O1 -pthread tests/koom_pacing_test.cpp -o /tmp/koom-pacing-test
          /tmp/koom-pacing-test
          python3 tests/koom_audio_test.py
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
      - shell: cmd
        run: |
          cl /nologo /std:c++20 /EHsc /W3 /utf-8 /DUNICODE /D_UNICODE /DNOMINMAX /DWIN32_LEAN_AND_MEAN tests\windows_ui_test.cpp /Fe:windows-ui-test.exe /link d3d11.lib d3dcompiler.lib dxgi.lib dcomp.lib d2d1.lib dwrite.lib windowscodecs.lib dwmapi.lib shell32.lib shlwapi.lib shcore.lib ole32.lib user32.lib gdi32.lib advapi32.lib winhttp.lib bcrypt.lib || exit /b 1
          cl /nologo /std:c++20 /EHsc /W4 tests\latest_worker_test.cpp /Fe:latest-worker-test.exe || exit /b 1
          cl /nologo /std:c++20 /EHsc /W4 tests\games_test.cpp /Fe:games-test.exe || exit /b 1
          cl /nologo /std:c++20 /EHsc /W4 tests\peggle_test.cpp /Fe:peggle-test.exe || exit /b 1
          cl /nologo /std:c++20 /EHsc /W4 tests\appearance_test.cpp /Fe:appearance-test.exe || exit /b 1
          cl /nologo /std:c++20 /EHsc /W4 /O2 tests\chess_test.cpp /Fe:chess-test.exe || exit /b 1
          cl /nologo /std:c++20 /EHsc /W4 /O2 tests\garden_test.cpp /Fe:garden-test.exe || exit /b 1
          cl /nologo /std:c++20 /EHsc /W4 tests\shop_test.cpp /Fe:shop-test.exe || exit /b 1
          cl /nologo /std:c++20 /EHsc /W4 tests\game_trials_test.cpp /Fe:game-trials-test.exe || exit /b 1
          cl /nologo /std:c++20 /EHsc /W4 tests\kar_test.cpp /Fe:kar-test.exe || exit /b 1
          cl /nologo /std:c++20 /EHsc /W4 tests\release_selection_test.cpp /Fe:release-selection-test.exe || exit /b 1
          cl /nologo /std:c++20 /EHsc /W4 tests\koom_loading_test.cpp /Fe:koom-loading-test.exe || exit /b 1
          koom-loading-test.exe || exit /b 1
          cl /nologo /std:c++20 /EHsc /W4 tests\game_assets_test.cpp /Fe:game-assets-test.exe || exit /b 1
          game-assets-test.exe || exit /b 1
          cl /nologo /std:c++20 /EHsc /W4 tests\kar_pixels_test.cpp /Fe:kar-pixels-test.exe || exit /b 1
          cl /nologo /std:c++20 /EHsc /W4 tests\kar_physics_test.cpp /Fe:kar-physics-test.exe || exit /b 1
          cl /nologo /std:c++20 /EHsc /W4 tests\gpu_windows_test.cpp /Fe:gpu-test.exe /link d3d11.lib d3dcompiler.lib user32.lib gdi32.lib || exit /b 1
      - run: |
          .\windows-ui-test.exe
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          .\latest-worker-test.exe
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          .\games-test.exe
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          .\peggle-test.exe
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          .\appearance-test.exe
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          .\chess-test.exe
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          .\garden-test.exe
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          .\shop-test.exe
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          .\game-trials-test.exe
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          .\kar-test.exe
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          .\release-selection-test.exe
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          .\kar-pixels-test.exe
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          .\kar-physics-test.exe
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          .\gpu-test.exe
          exit $LASTEXITCODE
      - name: Download and verify game data through native Windows HTTP
        shell: cmd
        run: |
          cl /nologo /std:c++20 /EHsc /W3 /utf-8 /DUNICODE /D_UNICODE /DNOMINMAX /DWIN32_LEAN_AND_MEAN tests\windows_game_data_test.cpp /Fe:windows-game-data-test.exe /link d3d11.lib d3dcompiler.lib dxgi.lib dcomp.lib d2d1.lib dwrite.lib windowscodecs.lib dwmapi.lib shell32.lib shlwapi.lib shcore.lib ole32.lib user32.lib gdi32.lib advapi32.lib winhttp.lib bcrypt.lib || exit /b 1
          windows-game-data-test.exe
  koom-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: false
          install: mingw-w64-x86_64-gcc mingw-w64-x86_64-python
      - shell: msys2 {0}
        run: |
          python koom/build.py --windows
          python tests/koom_audio_test.py
