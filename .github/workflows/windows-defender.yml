name: Windows release Defender scan
on:
  workflow_dispatch:
    inputs:
      release:
        description: Published candidate tag to scan alongside historical releases
        required: true
        default: v0.5.1
        type: string
      cloud_validation:
        description: Also require a working Defender MAPS cloud connection
        required: true
        default: true
        type: boolean
permissions:
  contents: read
jobs:
  scan:
    runs-on: windows-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        release: ['v0.3.1', 'v0.4.5', 'v0.5.0', '${{ inputs.release }}']
    steps:
      - uses: actions/checkout@v4
      - name: Scan exact release with updated Defender intelligence
        shell: pwsh
        env:
          RELEASE_TAG: ${{ matrix.release }}
          REQUIRE_CLOUD: ${{ inputs.cloud_validation }}
        run: |
          if ($env:REQUIRE_CLOUD -eq 'true') {
            ./windows/scan-release.ps1 -ReleaseTag $env:RELEASE_TAG -RequireRealtime -RequireCloud
          } else {
            Write-Output 'Checking updated Defender on-demand scanning with real-time protection. MAPS cloud validation is not included in this run.'
            ./windows/scan-release.ps1 -ReleaseTag $env:RELEASE_TAG -RequireRealtime
          }
